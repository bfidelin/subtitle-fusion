context_terms:
  Blodak: Below Deck
  Blow Deck: Below Deck
  Blow deck: Below Deck
  blodak: Below Deck
ocr:
  active_text_fps_max: 5.0
  active_text_fps_min: 2.0
  detector_candidates:
  - pp-ocrv5-mobile-det
  - pp-ocrv6-tiny-det
  - openvino-horizontal-text-detection-0001
  perceptual_hash_cache: true
  periodic_fps: 0.5
  recognize_only_changed_crops: true
  track_boxes: true
  use_shot_boundaries: true
paths:
  cache_dir: data/cache
  imdb_dir: data/imdb
  work_dir: data/work
performance:
  benchmark_path_name: output.benchmark.json
  cache_by_media_and_config_hash: true
  cache_media_evidence: true
  write_benchmark_json: true
pipeline:
  enable_imdb: true
  enable_media_preflight: true
  enable_ocr: true
  enable_sdh: true
  enable_vision: false
  prefer_pgs_event_ocr_before_video_ocr: true
  prefer_text_subtitle_track: true
  reuse_embedded_subtitles: false
  write_debug_json: true
  enable_forced_alignment: true
providers:
  asr: whisper_http
  diarization: pyannote_gpu
  imdb: local_tsv
  ocr: sparse
  vision: stub
pyannote_gpu:
  max_speakers: null
  min_speakers: null
  python: /home/calmos/miniconda3/envs/nemo-diar/bin/python
  timeout_sec: 240.0
forced_alignment:
  python: /home/calmos/miniconda3/envs/senko/bin/python
  script: /home/calmos/subtitle-fusion/scripts/forced_align_worker.py
  timeout_sec: 240
  language: en
voiceprints:
  enabled: true
  max_samples_per_character: 12
  min_margin: 0.04
  min_score: 0.78
  store_dir: data/voiceprints
whisper_http:
  diarize: false
  diarize_threshold: 0.8
  encode: true
  engine: faster_whisper
  language: null
  output: json
  task: transcribe
  timeout_sec: 720
  url: http://127.0.0.1:9000/asr
  vad_filter: true
  word_timestamps: true
whisperx:
  align: true
  batch_size: 16
  cache_dir: null
  compute_type: float16
  device: auto
  diarization_model: pyannote/speaker-diarization-community-1
  diarize: true
  fill_nearest_speaker: false
  hf_token_env: HF_TOKEN
  language: null
  max_speakers: null
  min_speakers: null
  model: large-v3-turbo
  return_embeddings: true
  vad_method: pyannote
