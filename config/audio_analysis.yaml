audio_events:
  enabled: true
  scout:
    provider: yamnet
    min_event_score: 0.55
  verifier:
    provider: panns
    device: cuda
    min_event_score: 0.68
    window_seconds: 2.0
    hop_seconds: 1.0
    labels_allowlist:
      - Music
      - Door
      - Doorbell
      - Knock
      - Telephone bell ringing
      - Ringtone
      - Gunshot, gunfire
      - Explosion
      - Siren
      - Laughter
      - Crying, sobbing
      - Applause
      - Dog
      - Glass
      - Breaking
      - Vehicle
      - Engine
  verify_only_candidates: true
  merge_adjacent_events: true
  visible_plot_relevant_only: true

music_detection:
  provider: essentia
  enabled: true
  detect_music_presence: true
  detect_vocal_vs_instrumental: true
  detect_mood: true

track_recognition:
  provider_order:
    - shazamkit
    - audd
    - acrcloud
  enabled: false
  query_only_when_music_present: true
  min_excerpt_seconds: 8
  max_excerpt_seconds: 20
  store_metadata_only_by_default: true

source_separation:
  enabled: false
  provider: demucs
  run_only_for_vocal_music: true
  run_only_on_selected_windows: true

lyrics_transcription:
  enabled: false
  require_source_separation: true
  min_lyrics_confidence: 0.75
  include_visible_lyrics_only_when_plot_relevant: true
