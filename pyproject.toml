[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-fusion"
version = "0.2.0"
description = "Fast enriched SDH subtitle generation with ASR, diarization, OCR and evidence fusion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Bruno Fidelin" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
whisperx = [
  "whisperx>=3.8.6,<3.9",
]
audio = [
  "panns-inference>=0.1.1",
  "librosa>=0.11",
  "numpy>=2.0",
]
runtime = [
  "whisperx>=3.8.6,<3.9",
  "panns-inference>=0.1.1",
  "librosa>=0.11",
  "numpy>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]
all = [
  "whisperx>=3.8.6,<3.9",
  "panns-inference>=0.1.1",
  "librosa>=0.11",
  "numpy>=2.0",
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[project.scripts]
subtitle-fusion = "src.main:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness. Broader modernization/import/style categories
# are useful in dedicated cleanup changes, but must not gate unrelated feature PRs.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
