[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-fusion"
version = "0.2.0"
description = "Enriched SDH subtitle generation with WhisperX, pyannote, voiceprints and audio events"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bruno Fidelin" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
asr = [
  "whisperx>=3.7",
]
diarization = [
  "pyannote.audio>=4.0",
]
audio = [
  "panns-inference>=0.1.1",
  "librosa>=0.11",
  "numpy>=2.0",
]
runtime = [
  "whisperx>=3.7",
  "pyannote.audio>=4.0",
  "panns-inference>=0.1.1",
  "librosa>=0.11",
  "numpy>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]
all = [
  "whisperx>=3.7",
  "pyannote.audio>=4.0",
  "panns-inference>=0.1.1",
  "librosa>=0.11",
  "numpy>=2.0",
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[project.scripts]
subtitle-fusion = "src.main:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
